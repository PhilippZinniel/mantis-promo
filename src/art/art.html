<!doctype html><meta charset=utf-8><body style="margin:0;background:#222">
<link rel="stylesheet" href="/node_modules/@fontsource/barlow-condensed/600.css">
<link rel="stylesheet" href="/node_modules/@fontsource/noto-sans-sc/chinese-simplified-700.css">
<script type="module">
import * as V from './landscape.js';
import * as P from './pages.js';
window.bake = async (name, opts = {}) => {
  const out = {};
  if (name === 'vista') {
    const L = V.drawVista(opts);
    for (const k of ['sky', 'far', 'mid', 'near', 'leaves', 'mist', 'flat']) out[k] = L[k].toDataURL('image/png');
    out.meta = { moon: L.moon, traveler: L.traveler, W: L.W, H: L.H, U: L.U };
  }
  if (name === 'panels') {
    for (const [k, fn, o] of [['closeup', V.drawCloseup, { Wu: 590, Hu: 664 }], ['valley', V.drawValley, { Wu: 424, Hu: 664 }], ['burst', V.drawBurst, { Wu: 1000, Hu: 560 }]]) { const r = fn({ ...opts, ...o }); out[k] = r.flat.toDataURL('image/png'); }
  }
  if (name === 'wall') {
    await Promise.all([document.fonts.load('600 54px "Barlow Condensed"', 'ABCDEFGHIJKLMNOPQRSTUVWXYZ.,?!\'-'), document.fonts.load('700 50px "Noto Sans SC"', P.ZH_ALL)]);
    await document.fonts.ready;
    const { atlas, meta } = P.bakeLibrary(opts);
    out.zh = atlas.zh.toDataURL('image/png'); out.en = atlas.en.toDataURL('image/png'); out.meta = meta;
  }
  return out;
};
window.ready = true;
</script>
